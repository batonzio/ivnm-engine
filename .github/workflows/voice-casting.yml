name: IVNM Voice Casting - retired VoxCPM2 policy check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Confirm VoxCPM2 is excluded
        run: |
          python -c "import json; p=json.load(open('voice/presets.json')); assert p['model_review']['voxcpm2']['status']=='rejected' and not p['capabilities']['voxcpm2']['enabled']"
