name: IVNM Pocket QA - rejudge existing takes
on:
  push:
    branches: [main]
    paths: ['audio-qa/quality.py', 'audio-qa/test_quality.py', '.github/workflows/audio-qa-pocket-rejudge.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  rejudge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '4'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v5
        with:
          artifact-ids: '15141013329'
          run-id: '45868017166'
          github-token: ${{ github.token }}
          path: out
      - name: Install independent QA runtime only
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install faster-whisper numpy soundfile
      - name: Test number spelling and strict word gate
        run: python -m unittest discover -s audio-qa -p 'test_*.py' -v
      - name: Rejudge existing recordings without TTS
        run: |
          sha256sum out/line*-seed*.wav > out/original-takes.sha256
          python -u audio-qa/pilot.py judge pocket
          sha256sum -c out/original-takes.sha256
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: pocket-qa-rejudged-${{ github.run_id }}
          path: out/
          retention-days: 14
