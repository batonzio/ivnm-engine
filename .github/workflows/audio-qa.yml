name: IVNM Audio QA - multi-take pilot
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        engine: [pocket, chatterbox]
    env:
      ENGINE: ${{ matrix.engine }}
      OMP_NUM_THREADS: '4'
      CUDA_VISIBLE_DEVICES: ''
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v5
        with:
          artifact-ids: '15139756016'
          run-id: '45862558689'
          github-token: ${{ github.token }}
          path: refs
      - name: Install synthesis runtime
        run: |
          mkdir -p out
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          if [ "$ENGINE" = pocket ]; then
            python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
            python -m pip install pocket-tts==4.0.1 soundfile
          else
            python -m pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
            python -m pip install chatterbox-tts==0.1.7 soundfile --extra-index-url https://download.pytorch.org/whl/cpu
          fi
          python -m pip freeze > out/synthesis-dependencies.txt
      - name: Run quality unit tests
        run: python -m unittest discover -s audio-qa -p 'test_*.py' -v
      - name: Generate three takes per line
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -u audio-qa/pilot.py generate "$ENGINE"
      - name: Install independent ASR environment
        run: |
          python -m venv /tmp/ivnm-asr
          /tmp/ivnm-asr/bin/python -m pip install faster-whisper numpy soundfile
          /tmp/ivnm-asr/bin/python -m pip freeze > out/asr-dependencies.txt
      - name: Select only technically passing takes
        run: /tmp/ivnm-asr/bin/python -u audio-qa/pilot.py judge "$ENGINE"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: audio-qa-${{ matrix.engine }}-${{ github.run_id }}
          path: out/
          retention-days: 14
