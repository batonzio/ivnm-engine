name: IVNM edited line real synthesis and listening pack
on:
  pull_request:
    branches: [engines/integration-candidate-v0.1]
    types: [opened, synchronize, reopened]
    paths: ['production/edited_line_audition.py','.github/workflows/audio-edited-line-audition.yml']
permissions:
  contents: read
  actions: read
jobs:
  audition:
    if: github.head_ref == 'engines/audio-handoff-v0.1'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '4'
      CUDA_VISIBLE_DEVICES: ''
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v5
        with:
          artifact-ids: '15187344062'
          run-id: '45977862112'
          github-token: ${{ github.token }}
          path: prior
      - uses: actions/download-artifact@v5
        with:
          artifact-ids: '15142281688'
          run-id: '45869947186'
          github-token: ${{ github.token }}
          path: review
      - name: Prepare actual cached lines
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install numpy soundfile PyYAML
          python production/edited_line_audition.py stage
          FP=$(python -c 'import json;print(json.load(open("bundle/seed-report.json"))["fingerprint"])')
          python production/pipeline.py synth --engine chatterbox --out edited --line-cache bundle/cache --cache-fingerprint "$FP"
      - name: Synthesize three takes of changed Lucy line only
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          start=$(date +%s)
          python -m venv /tmp/ivnm-pocket
          /tmp/ivnm-pocket/bin/python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          /tmp/ivnm-pocket/bin/python -m pip install pocket-tts==4.0.1 soundfile
          /tmp/ivnm-pocket/bin/python -m pip freeze > edited/pocket-runtime.txt
          echo "$(( $(date +%s)-start ))" > edited/pocket-environment-seconds.txt
          FP=$(python -c 'import json;print(json.load(open("bundle/seed-report.json"))["fingerprint"])')
          /tmp/ivnm-pocket/bin/python -u production/pipeline.py synth --engine pocket --out edited --line-cache bundle/cache --cache-fingerprint "$FP"
      - name: Independent ASR, speaker consistency, mastering and full-track verification
        run: |
          start=$(date +%s)
          python -m venv /tmp/ivnm-qa
          /tmp/ivnm-qa/bin/python -m pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          /tmp/ivnm-qa/bin/python -m pip install faster-whisper==1.2.1 speechbrain==1.0.3 numpy soundfile 'huggingface_hub<1.0'
          /tmp/ivnm-qa/bin/python -m pip freeze > edited/qa-runtime.txt
          echo "$(( $(date +%s)-start ))" > edited/qa-environment-seconds.txt
          /tmp/ivnm-qa/bin/python -u production/pipeline.py judge --out edited
          /tmp/ivnm-qa/bin/python -u production/edited_line_audition.py verify
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: edited-line-acceptance-${{ github.run_id }}
          path: |
            audition/
            edited/*.json
            edited/*.txt
            edited/audio/
          retention-days: 14
