name: IVNM Speech Director Lite contracts
on:
  push:
    branches: [main]
    paths: ['speech-director/**', 'production/pipeline.py', '.github/workflows/speech-director.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: |
          python -m pip install numpy soundfile PyYAML
          python -m unittest discover -s speech-director -p 'test_*.py' -v
          python md-first/test_voice_bank.py
          python -m unittest discover -s audio-qa -p 'test_*.py' -v
          python production/pipeline.py prepare --md speech-director/probe.md --demo
          python - <<'PY'
          import json
          p=json.load(open('out/plan.json'))
          assert p['tracks'][0]['status']=='ready'
          assert sum(len(x) for x in json.load(open('out/tasks.json')).values())==9
          print(json.dumps(p['tracks'][0],indent=2))
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: speech-director-plan-${{ github.run_id }}
          path: out/*.json
          retention-days: 14
