name: IVNM Casting Round 2 - Pocket and Kitten comparison
on:
  workflow_run:
    workflows: ['IVNM Casting Round 2 - Chatterbox']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      source_run:
        description: 'Round 2 source run ID'
        required: true
        default: '45844095394'
permissions:
  contents: read
  actions: read
jobs:
  audition:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion != 'cancelled') || (github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.conclusion != 'cancelled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        engine: [pocket, kitten]
        category: [UK-C-M, UK-C-F, UK-T-M, UK-T-F, UK-A-M, UK-A-F, CA-C-M, CA-C-F, CA-T-M, CA-T-F, CA-A-M, CA-A-F]
    env:
      SOURCE_RUN: ${{ github.event.workflow_run.id || inputs.source_run }}
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Validate source run ID
        run: |
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          mkdir -p out
      - uses: actions/download-artifact@v5
        with:
          name: round2-${{ matrix.category }}-${{ env.SOURCE_RUN }}
          path: refs
          run-id: ${{ env.SOURCE_RUN }}
          github-token: ${{ github.token }}
      - name: Install CPU model
        env:
          ENGINE: ${{ matrix.engine }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          if [ "$ENGINE" = pocket ]; then
            python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
            python -m pip install pocket-tts==4.0.1 soundfile
          else
            python -m pip install torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu
            python -m pip install kittenml soundfile --extra-index-url https://download.pytorch.org/whl/cpu
          fi
          python -m pip freeze > out/dependencies.txt
      - name: Compare with exact same voice references and script
        run: |
          python -m py_compile casting/compare.py
          python -u casting/compare.py "${{ matrix.engine }}" "${{ matrix.category }}"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: compare-${{ matrix.engine }}-${{ matrix.category }}-${{ github.run_id }}
          path: out/
          retention-days: 14
          if-no-files-found: warn
