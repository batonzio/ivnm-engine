name: IVNM continuity diagnostics - existing Lucy takes
on:
  push:
    branches: [main]
    paths: ['audio-qa/continuity.py', 'audio-qa/test_continuity.py', '.github/workflows/continuity-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v5
        with:
          artifact-ids: '15187344062'
          run-id: '45977862112'
          github-token: ${{ github.token }}
          path: pocket
      - uses: actions/download-artifact@v5
        with:
          artifact-ids: '15188004982'
          run-id: '45979529126'
          github-token: ${{ github.token }}
          path: chatterbox
      - run: |
          python -m pip install numpy soundfile
          python -m unittest discover -s audio-qa -p 'test_continuity.py' -v
          python audio-qa/continuity.py pocket chatterbox continuity-report.json
      - uses: actions/upload-artifact@v6
        with:
          name: continuity-diagnostics-${{ github.run_id }}
          path: continuity-report.json
          retention-days: 14
