name: IVNM speech texture comparison - no TTS
on:
  push:
    branches: [main]
    paths: ['postprocess/texture_compare.py', '.github/workflows/texture-audition.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v5
        with:
          artifact-ids: '15187344062'
          run-id: '45977862112'
          github-token: ${{ github.token }}
          path: prior
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install numpy soundfile
          python postprocess/texture_compare.py prior comparison
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ivnm-texture-comparison-${{ github.run_id }}
          path: comparison/
          retention-days: 14
