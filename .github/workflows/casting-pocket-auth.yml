name: IVNM Casting Round 2 - Pocket authenticated
on:
  push:
    branches: [main]
    paths: ['.github/workflows/casting-pocket-auth.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ivnm-pocket-auth-casting
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Check authenticated model access
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -m pip install huggingface_hub
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          if not os.environ.get("HF_TOKEN"):
              raise SystemExit("HF_TOKEN secret missing")
          api = HfApi()
          api.auth_check("kyutai/pocket-tts", repo_type="model", token=os.environ["HF_TOKEN"])
          print("Authenticated Pocket TTS model access confirmed.")
          PY
  audition:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        category: [UK-C-M, UK-C-F, UK-T-M, UK-T-F, UK-A-M, UK-A-F, CA-C-M, CA-C-F, CA-T-M, CA-T-F, CA-A-M, CA-A-F]
    env:
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Download original reference
        if: matrix.category != 'CA-A-M'
        uses: actions/download-artifact@v5
        with:
          name: round2-${{ matrix.category }}-45844095394
          run-id: '45844095394'
          github-token: ${{ github.token }}
          path: refs
      - name: Download repaired CA-A-M reference
        if: matrix.category == 'CA-A-M'
        uses: actions/download-artifact@v5
        with:
          artifact-ids: '15139756016'
          run-id: '45862558689'
          github-token: ${{ github.token }}
          path: refs
      - name: Install Pocket CPU runtime
        run: |
          mkdir -p out
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pocket-tts==4.0.1 soundfile
          python -m pip freeze > out/dependencies.txt
      - name: Generate with authenticated voice cloning
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          CATEGORY: ${{ matrix.category }}
        run: |
          python -m py_compile casting/compare.py
          python -u casting/compare.py pocket "$CATEGORY"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: compare-pocket-${{ matrix.category }}-${{ github.run_id }}
          path: out/
          retention-days: 14
          if-no-files-found: warn
