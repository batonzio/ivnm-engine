name: IVNM audio handoff contracts
on:
  pull_request:
    branches: [engines/integration-candidate-v0.1]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  contracts:
    if: github.head_ref == 'engines/audio-handoff-v0.1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: |
          python -m pip install numpy soundfile PyYAML
          python -m compileall -q production local_engines
          python -m unittest discover -s production -p 'test_*.py' -v
          python -m unittest discover -s audio-qa -p 'test_*.py' -v
          python -m unittest discover -s speech-director -p 'test_*.py' -v
          python md-first/test_voice_bank.py
          python -m unittest local_engines.test_adapters local_engines.test_foundation local_engines.test_resources local_engines.test_audio local_engines.test_compatibility local_engines.test_wordnet local_engines.test_responsive -v
